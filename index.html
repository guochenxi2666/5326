<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BJAK 智能简历筛选系统 - 可编辑JD版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #181DD8;
            --primary-light: #99ACFF;
            --primary-dark: #001B96;
            --bg-main: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.9);
            --bg-card-solid: #f8f9fc;
            --bg-section: rgba(255, 255, 255, 0.7);
            --text-primary: #1a1a2e;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --accent-cyan: #00D9FF;
            --accent-purple: #A855F7;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --glow-primary: rgba(24, 29, 216, 0.2);
            --glow-cyan: rgba(0, 217, 255, 0.2);
            --border-subtle: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-main);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(24, 29, 216, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(0, 217, 255, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(168, 85, 247, 0.02) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 50px 20px;
            position: relative;
            margin-bottom: 40px;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 100%;
            background: linear-gradient(180deg, rgba(24, 29, 216, 0.08) 0%, transparent 100%);
            border-radius: 0;
            z-index: -1;
        }

        .header-decoration {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .header-line {
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        .header-icon {
            width: 60px;
            height: 60px;
            position: relative;
        }

        .header-icon svg {
            width: 100%;
            height: 100%;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            color: #181DD8;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }



        .header p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .section {
            background: var(--bg-section);
            backdrop-filter: blur(20px);
            border: none;
            border-radius: 0;
            padding: 30px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary-light), transparent);
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: var(--text-primary);
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: none;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-title .step {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 0 20px var(--glow-primary);
        }

        .job-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .job-card {
            background: var(--bg-card);
            border: none;
            border-radius: 0;
            padding: 18px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .job-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(24, 29, 216, 0.1) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .job-card:hover {
            border-color: var(--primary-light);
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(24, 29, 216, 0.3);
        }

        .job-card:hover::before {
            opacity: 1;
        }

        .job-card.selected {
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(24, 29, 216, 0.3) 0%, rgba(0, 27, 150, 0.2) 100%);
            box-shadow: 0 0 30px var(--glow-primary), inset 0 0 30px rgba(24, 29, 216, 0.1);
        }

        .job-card.selected::after {
            content: "✓";
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-cyan) 100%);
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 0 15px var(--glow-cyan);
        }

        .job-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-size: 1.05rem;
        }

        .job-info {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            gap: 15px;
        }

        .job-salary {
            color: var(--accent-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
        }

        .job-tags {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .job-tag {
            background: rgba(153, 172, 255, 0.1);
            border: none;
            padding: 4px 12px;
            border-radius: 0;
            font-size: 0.75rem;
            color: var(--primary-light);
        }

        .job-card.selected .job-tag {
            background: rgba(0, 217, 255, 0.15);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 0;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            box-shadow: 0 4px 20px var(--glow-primary);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--glow-primary);
        }

        .btn-outline {
            background: transparent;
            border: none;
            color: var(--primary-light);
        }

        .btn-outline:hover {
            background: rgba(24, 29, 216, 0.2);
            box-shadow: 0 0 20px var(--glow-primary);
        }

        .btn-success {
            background: linear-gradient(135deg, #10B981, #059669);
            color: white;
            border: none;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4);
        }

        .btn-glow {
            position: relative;
            overflow: hidden;
        }

        .btn-glow::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: btnShine 3s infinite;
        }

        @keyframes btnShine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .smart-mode {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(0, 217, 255, 0.05) 100%);
            border: none;
            border-radius: 0;
            padding: 20px;
            margin-top: 20px;
        }

        .smart-mode-title {
            font-weight: 600;
            color: var(--success);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
        }

        .smart-mode-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .smart-mode-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .toggle-switch {
            position: relative;
            width: 56px;
            height: 28px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-card-solid);
            border: none;
            transition: 0.4s;
            border-radius: 0;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 2px;
            bottom: 2px;
            background: var(--text-muted);
            transition: 0.4s;
            border-radius: 0;
        }

        .toggle-switch input:checked + .toggle-slider {
            background: linear-gradient(135deg, var(--success), var(--accent-cyan));
            border-color: var(--success);
        }

        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(28px);
            background: white;
            box-shadow: 0 0 10px var(--success);
        }

        .upload-area {
            border: none;
            border-radius: 0;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
            background: rgba(24, 29, 216, 0.05);
            position: relative;
            overflow: hidden;
        }

        .upload-area::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--primary), var(--accent-cyan), var(--primary));
            border-radius: 0;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--accent-cyan);
            background: rgba(0, 217, 255, 0.08);
            box-shadow: 0 0 40px var(--glow-cyan), inset 0 0 60px rgba(0, 217, 255, 0.05);
        }

        .upload-area:hover::before, .upload-area.dragover::before {
            opacity: 0.3;
            animation: borderGlow 2s linear infinite;
        }

        @keyframes borderGlow {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(30deg); }
        }

        .upload-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }

        .upload-icon svg {
            width: 80px;
            height: 80px;
            stroke: var(--primary-light);
            filter: drop-shadow(0 0 20px var(--glow-primary));
        }

        .upload-text {
            font-size: 1.3rem;
            color: var(--text-primary);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .upload-hint {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .file-input {
            display: none;
        }

        .file-list {
            margin-top: 25px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: var(--bg-card);
            border: none;
            border-radius: 0;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .file-item:hover {
            border-color: var(--primary-light);
            box-shadow: 0 5px 20px rgba(24, 29, 216, 0.2);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .file-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .file-details {
            flex: 1;
        }

        .file-name {
            font-weight: 500;
            color: var(--text-primary);
            word-break: break-all;
        }

        .file-status {
            font-size: 0.85rem;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-pending { color: var(--warning); }
        .status-success { color: var(--success); }
        .status-error { color: var(--danger); }
        .status-processing { color: var(--accent-cyan); }

        .status-processing::after {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            border: none;
            border-top-color: transparent;
            border-radius: 0;
            animation: spin 1s linear infinite;
            margin-left: 5px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-remove {
            background: rgba(239, 68, 68, 0.1);
            border: none;
            color: var(--danger);
            cursor: pointer;
            padding: 8px 15px;
            border-radius: 0;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn-remove:hover {
            background: var(--danger);
            color: white;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }

        .start-section {
            text-align: center;
            padding: 40px;
        }

        .btn-start {
            padding: 18px 60px;
            font-size: 1.3rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            box-shadow: 0 5px 30px var(--glow-primary);
            position: relative;
            overflow: hidden;
        }

        .btn-start::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-start:hover:not(:disabled)::before {
            left: 100%;
        }

        .btn-start:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            transform: translateY(-4px);
            box-shadow: 0 10px 50px var(--glow-primary), 0 0 80px var(--glow-primary);
        }

        .btn-start:disabled {
            background: var(--bg-card-solid);
            border-color: var(--border-subtle);
            cursor: not-allowed;
            box-shadow: none;
            color: var(--text-muted);
        }

        .results-section {
            display: none;
        }

        .results-section.active {
            display: block;
            animation: fadeIn 0.5s ease;
            background: #ffffff;
            margin: 0 -30px;
            padding: 40px 30px;
            border-radius: 0;
            margin-top: 30px;
        }

        .results-section .section-title { color: #1a1a2e; }
        .results-section .stat-card {
            background: #f8f9fc;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .results-section .stat-card:hover {
            box-shadow: 0 8px 25px rgba(24, 29, 216, 0.1);
            border-color: var(--primary-light);
        }
        .results-section .stat-value { color: var(--primary) !important; }
        .results-section .stat-label { color: #64748b !important; }
        .results-section .stat-card .stat-icon {
            background: linear-gradient(135deg, var(--primary), var(--accent-cyan));
        }
        .results-section .sort-select {
            background: #f1f5f9;
            color: #334155;
            border-color: #e2e8f0;
        }
        .results-section .candidate-card {
            background: #ffffff;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            color: #1a1a2e;
        }
        .results-section .candidate-card:hover {
            box-shadow: 0 10px 30px rgba(24, 29, 216, 0.12);
            border-color: var(--primary-light);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: none;
            border-radius: 0;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent-cyan));
        }

        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 50px rgba(24, 29, 216, 0.3);
            border-color: var(--primary-light);
        }

        .stat-icon { font-size: 2.5rem; margin-bottom: 15px; }

        .stat-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            animation: countUp 1s ease-out;
        }

        @keyframes countUp {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sort-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .sort-select {
            padding: 12px 20px;
            border: none;
            border-radius: 0;
            font-size: 0.95rem;
            cursor: pointer;
            background: var(--bg-card);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .sort-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--glow-primary);
        }

        .candidates-container {
            display: grid;
            gap: 20px;
        }

        .candidate-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: none;
            border-radius: 0;
            padding: 25px;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .candidate-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--text-muted);
            transition: all 0.3s ease;
        }

        .candidate-card:hover {
            transform: translateX(5px);
            border-color: var(--primary-light);
            box-shadow: 0 10px 40px rgba(24, 29, 216, 0.2);
        }

        .candidate-card.level-strong::before {
            background: linear-gradient(180deg, var(--success), var(--accent-cyan));
            box-shadow: 0 0 20px var(--success);
        }
        .candidate-card.level-recommend::before {
            background: linear-gradient(180deg, var(--primary), var(--primary-light));
            box-shadow: 0 0 20px var(--primary);
        }
        .candidate-card.level-pending::before {
            background: linear-gradient(180deg, var(--warning), var(--primary-light));
            box-shadow: 0 0 20px var(--warning);
        }
        .candidate-card.level-reject::before {
            background: linear-gradient(180deg, var(--danger), var(--primary));
            box-shadow: 0 0 20px var(--danger);
        }

        .candidate-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .candidate-name-section {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .candidate-avatar {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-cyan) 100%);
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.6rem;
            font-weight: 600;
            box-shadow: 0 0 30px var(--glow-primary);
            position: relative;
        }

        .candidate-avatar::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 0;
            background: linear-gradient(135deg, var(--primary), var(--accent-cyan));
            z-index: -1;
            opacity: 0.5;
            filter: blur(10px);
        }

        .candidate-name {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .candidate-file {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .candidate-score-section {
            text-align: right;
        }

        .candidate-score {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            text-shadow: 0 0 30px var(--glow-cyan);
        }

        .candidate-badge {
            display: inline-block;
            padding: 6px 18px;
            border-radius: 0;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .badge-strong {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.3), rgba(0, 217, 255, 0.2));
            border: none;
            color: var(--success);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }
        .badge-recommend {
            background: linear-gradient(135deg, rgba(24, 29, 216, 0.3), rgba(153, 172, 255, 0.2));
            border: none;
            color: var(--primary-light);
            box-shadow: 0 0 20px var(--glow-primary);
        }
        .badge-pending {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.1));
            border: none;
            color: var(--warning);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
        }
        .badge-reject {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.1));
            border: none;
            color: var(--danger);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
        }

        .best-match {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 0;
            font-size: 0.85rem;
            margin-left: 12px;
            box-shadow: 0 0 15px var(--glow-primary);
        }

        .candidate-summary {
            background: rgba(248, 249, 252, 0.8);
            border: none;
            border-radius: 0;
            padding: 18px;
            margin-top: 15px;
        }

        .summary-item {
            margin-bottom: 12px;
        }
        .summary-item:last-child { margin-bottom: 0; }

        .summary-label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .summary-text {
            color: var(--text-primary);
            font-size: 0.95rem;
            margin-top: 4px;
            line-height: 1.6;
        }

        .candidate-details {
            display: none;
            margin-top: 25px;
            padding-top: 25px;
            border-top: none;
        }

        .candidate-card.expanded .candidate-details {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        @media (max-width: 900px) {
            .details-grid { grid-template-columns: 1fr; }
        }

        .detail-section {
            background: rgba(248, 249, 252, 0.8);
            border: none;
            border-radius: 0;
            padding: 22px;
        }

        .detail-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05rem;
        }

        .radar-chart {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto;
        }

        .radar-grid {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 220px;
        }

        .radar-circle {
            position: absolute;
            border: none;
            border-radius: 0;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .radar-ring-1 { width: 55px; height: 55px; }
        .radar-ring-2 { width: 110px; height: 110px; }
        .radar-ring-3 { width: 165px; height: 165px; }
        .radar-ring-4 { width: 220px; height: 220px; }

        .radar-labels {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .radar-label {
            position: absolute;
            font-size: 0.7rem;
            color: var(--text-secondary);
            white-space: nowrap;
            text-align: center;
            transform: translate(-50%, -50%);
        }

        .scores-list {
            display: grid;
            gap: 12px;
        }

        .score-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .score-label {
            width: 110px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .score-bar-container {
            flex: 1;
            height: 8px;
            background: rgba(0, 0, 0, 0.08);
            border-radius: 0;
            overflow: hidden;
        }

        .score-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent-cyan) 100%);
            border-radius: 0;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--glow-cyan);
        }

        .score-value {
            width: 40px;
            text-align: right;
            font-weight: 600;
            color: var(--accent-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
        }

        .matched-jobs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .matched-job {
            background: rgba(24, 29, 216, 0.15);
            border: none;
            padding: 6px 14px;
            border-radius: 0;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .matched-job .job-score {
            background: linear-gradient(135deg, var(--primary), var(--accent-cyan));
            color: white;
            padding: 3px 10px;
            border-radius: 0;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .evaluation-section {
            background: rgba(248, 249, 252, 0.8);
            border: none;
            border-radius: 0;
            padding: 22px;
        }

        .evaluation-item {
            margin-bottom: 18px;
            padding-bottom: 18px;
            border-bottom: none;
        }
        .evaluation-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .evaluation-label {
            font-weight: 600;
            color: var(--primary-light);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .evaluation-text {
            color: var(--text-primary);
            line-height: 1.8;
        }

        .interview-tips {
            background: linear-gradient(135deg, rgba(24, 29, 216, 0.15) 0%, rgba(0, 217, 255, 0.05) 100%);
            border: none;
            border-radius: 0;
            padding: 18px;
            margin-top: 10px;
        }

        .export-section {
            text-align: center;
            padding: 35px;
            border-top: none;
            margin-top: 35px;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .loading-overlay.active { display: flex; }

        .loading-content {
            text-align: center;
            padding: 50px;
        }

        .loading-spinner {
            width: 80px;
            height: 80px;
            border: none;
            border-top-color: var(--accent-cyan);
            border-right-color: var(--primary);
            border-radius: 0;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
            box-shadow: 0 0 40px var(--glow-cyan);
        }

        .loading-text {
            font-size: 1.2rem;
            color: var(--text-primary);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
        }

        .loading-sub {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 10px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: #ffffff;
            border-radius: 0;
            max-width: 800px;
            width: 95%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            border-bottom: none;
            flex-shrink: 0;
        }

        .modal-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-close {
            width: 40px;
            height: 40px;
            border: none;
            background: #f1f5f9;
            border-radius: 0;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: #e2e8f0;
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 25px 30px;
            overflow-y: auto;
            flex: 1;
        }

        .jd-editor-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            border-bottom: none;
            padding-bottom: 15px;
        }

        .jd-tab {
            padding: 8px 16px;
            border: none;
            border-radius: 0;
            background: #f1f5f9;
            color: #64748b;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .jd-tab:hover {
            background: #e2e8f0;
            color: #1a1a2e;
        }

        .jd-tab.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 15px var(--glow-primary);
            border-color: var(--primary);
        }

        .jd-form-group {
            margin-bottom: 18px;
        }

        .jd-form-group label {
            display: block;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .jd-form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .jd-input, .jd-textarea {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 0;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: #f8f9fc;
            color: #1a1a2e;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .jd-input:focus, .jd-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--glow-primary);
            background: #ffffff;
        }

        .jd-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .jd-hint {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .jd-editor-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: none;
        }

        .jd-editor-actions .btn {
            flex: 1;
            justify-content: center;
        }

        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 16px 32px;
            border-radius: 0;
            font-weight: 500;
            box-shadow: 0 10px 40px rgba(24, 29, 216, 0.4);
            z-index: 3000;
            animation: fadeIn 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 1.8rem; letter-spacing: 2px; }
            .header p { font-size: 0.9rem; letter-spacing: 2px; }
            .job-grid { grid-template-columns: 1fr; }
            .stat-number { font-size: 2.5rem; }
            .candidate-score { font-size: 2.2rem; }
            .radar-chart { width: 240px; height: 240px; }
            .radar-grid { width: 180px; height: 180px; }
            .radar-ring-4 { width: 180px; height: 180px; }
            .radar-ring-3 { width: 135px; height: 135px; }
            .radar-ring-2 { width: 90px; height: 90px; }
            .radar-ring-1 { width: 45px; height: 45px; }
            .jd-form-row { grid-template-columns: 1fr; }
            .modal-content { margin: 10px; max-height: 95vh; }
            .modal-body { padding: 15px; }
            .jd-tab { padding: 6px 12px; font-size: 0.75rem; }
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 0; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-light); }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-decoration">
                <div class="header-line"></div>
                <div class="header-icon">
                    <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="30" cy="30" r="28" stroke="url(#grad1)" stroke-width="2" fill="none"></circle>
                        <path d="M20 30 L30 20 L40 30 L30 40 Z" fill="url(#grad1)" opacity="0.8"></path>
                        <circle cx="30" cy="30" r="8" fill="url(#grad1)"></circle>
                        <defs>
                            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#181DD8"></stop>
                                <stop offset="50%" style="stop-color:#99ACFF"></stop>
                                <stop offset="100%" style="stop-color:#00D9FF"></stop>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="header-line"></div>
            </div>
            <h1>BJAK 智能简历筛选系统</h1>
            <p>AI-Powered Resume Screening · 支持岗位JD编辑</p>
        </header>

        <section class="section" id="jobSection">
            <h2 class="section-title">
                <span class="step">1</span>
                选择 / 编辑目标岗位
            </h2>
            <div class="job-grid" id="jobGrid"></div>
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="selectAllJobs()">
                    全选岗位
                </button>
                <button class="btn btn-outline" onclick="clearAllJobs()">
                    清除选择
                </button>
                <button class="btn btn-success" onclick="openJDEditor()">
                    编辑岗位JD
                </button>
                <button class="btn btn-outline" onclick="resetJobs()">
                    恢复默认
                </button>
            </div>
            <div class="smart-mode">
                <div class="smart-mode-header">
                    <div class="smart-mode-title">
                        智能推荐模式
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="smartModeToggle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <p class="smart-mode-desc">开启后，系统将根据简历内容自动推荐最匹配的岗位，并显示所有岗位的详细评分对比</p>
            </div>
        </section>

        <div class="modal-overlay" id="jdEditorModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>编辑岗位JD</h2>
                    <button class="modal-close" onclick="closeJDEditor()">×</button>
                </div>
                <div class="modal-body">
                    <div class="jd-editor-tabs" id="jdTabs"></div>
                    <div class="jd-editor-panel" id="jdEditorPanel">
                        <div class="jd-form-group">
                            <label>岗位标题 *</label>
                            <input type="text" id="jdTitle" class="jd-input" placeholder="例如：AI 全栈工程师">
                        </div>
                        <div class="jd-form-row">
                            <div class="jd-form-group">
                                <label>薪资范围</label>
                                <input type="text" id="jdSalary" class="jd-input" placeholder="例如：40-80k">
                            </div>
                            <div class="jd-form-group">
                                <label>经验要求</label>
                                <input type="text" id="jdExperience" class="jd-input" placeholder="例如：1-3年">
                            </div>
                        </div>
                        <div class="jd-form-group">
                            <label>核心关键词（高权重）</label>
                            <input type="text" id="jdHighKeywords" class="jd-input" placeholder="用英文逗号分隔，例如：Python, PyTorch, LangChain">
                            <small class="jd-hint">这些关键词匹配度更高，对评分影响较大</small>
                        </div>
                        <div class="jd-form-group">
                            <label>次要关键词（中权重）</label>
                            <input type="text" id="jdMediumKeywords" class="jd-input" placeholder="用英文逗号分隔，例如：AWS, Docker, Kubernetes">
                            <small class="jd-hint">这些关键词对评分有一定影响</small>
                        </div>
                        <div class="jd-form-group">
                            <label>岗位描述（用于语义匹配）</label>
                            <textarea id="jdDescription" class="jd-textarea" rows="4" placeholder="输入岗位职责、要求等详细描述..."></textarea>
                            <small class="jd-hint">描述中的关键词也会被用于匹配，提高评分准确性</small>
                        </div>
                    </div>
                    <div class="jd-editor-actions">
                        <button class="btn btn-primary" onclick="saveJDChanges()">保存所有岗位</button>
                        <button class="btn btn-outline" onclick="closeJDEditor()">取消</button>
                    </div>
                </div>
            </div>
        </div>

        <section class="section" id="uploadSection">
            <h2 class="section-title">
                <span class="step">2</span>
                上传简历文件
            </h2>
            <div class="upload-area" id="uploadArea">
                <input type="file" class="file-input" id="fileInput" multiple accept=".pdf,.doc,.docx">
                <div class="upload-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                </div>
                <p class="upload-text">拖拽文件到此处，或点击选择文件</p>
                <p class="upload-hint">支持 PDF、Word 格式，可同时上传多个文件</p>
            </div>
            <div class="file-list" id="fileList"></div>
        </section>

        <section class="section start-section" id="startSection">
            <button class="btn-start btn-glow" id="startBtn" onclick="startScreening()" disabled>开始智能筛选</button>
            <p style="margin-top: 15px; color: var(--text-muted); font-size: 0.9rem;">
                请先选择目标岗位并上传简历文件
            </p>
        </section>

        <section class="section results-section" id="resultsSection">
            <h2 class="section-title">
                <span class="step">统计</span>
                筛选结果概览
            </h2>
            <div class="stats-grid" id="statsGrid"></div>
            <div class="sort-controls">
                <select class="sort-select" id="sortSelect" onchange="sortCandidates()">
                    <option value="score-desc">按评分 (高到低)</option>
                    <option value="score-asc">按评分 (低到高)</option>
                    <option value="name-asc">按姓名 (A到Z)</option>
                    <option value="name-desc">按姓名 (Z到A)</option>
                </select>
                <button class="btn btn-primary" onclick="exportCSV()">
                    导出CSV
                </button>
            </div>
            <div class="candidates-container" id="candidatesContainer"></div>
            <div class="export-section">
                <button class="btn btn-primary btn-glow" onclick="exportCSV()">
                    导出全部结果为CSV
                </button>
            </div>
        </section>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p class="loading-text">正在分析简历...</p>
            <p class="loading-sub" id="loadingStatus">准备中...</p>
        </div>
    </div>

    <script>
        var DEFAULT_JOBS = [
            { id: 1, title: 'AI 全栈工程师', salary: '40-80k', experience: '1-3年', 
              keywords: { high: ['Python', 'PyTorch', 'TensorFlow', 'LangChain', 'Node.js', 'React', 'Vue', 'FastAPI', 'Django', 'PostgreSQL', 'MongoDB', 'Redis', 'Docker', 'Kubernetes'], 
                          medium: ['TypeScript', 'GraphQL', 'AWS', 'GCP'] },
              description: '负责AI应用的全栈开发，包括前端界面、后端API和模型部署。需要熟悉主流AI框架和全栈开发技术。' },
            { id: 2, title: 'ML 算法工程师', salary: '30-60k', experience: '1-3年',

        function handleFiles(files) {
            Array.from(files).forEach(function(file) {
                var ext = file.name.split('.').pop().toLowerCase();
                if (['pdf', 'doc', 'docx'].indexOf(ext) !== -1) {
                    var fileObj = {
                        id: Date.now() + Math.random(),
                        file: file,
                        name: file.name,
                        type: ext,
                        status: 'pending',
                        content: null,
                        candidateName: null
                    };
                    uploadedFiles.push(fileObj);
                    parseFile(fileObj);
                }
            });
            renderFileList();
            updateStartButton();

        async function parseFile(fileObj) {
            fileObj.status = 'processing';
            renderFileList();
            try {
                var content = '';
                if (fileObj.type === 'pdf') {
                    content = await parsePDF(fileObj.file);
                } else if (fileObj.type === 'docx' || fileObj.type === 'doc') {
                    content = await parseDocx(fileObj.file);
                }
                fileObj.content = content;
                fileObj.candidateName = extractCandidateName(content);
                fileObj.status = 'success';
            } catch (error) {
                console.error('Parse error:', error);
                fileObj.status = 'error';
                fileObj.error = error.message;
            }
            renderFileList();
            updateStartButton();
        }

        async function parsePDF(file) {
            var arrayBuffer = await file.arrayBuffer();
            var pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            var fullText = '';
            for (var i = 1; i <= pdf.numPages; i++) {
                var page = await pdf.getPage(i);
                var textContent = await page.getTextContent();
                fullText += textContent.items.map(function(item) { return item.str; }).join(' ') + '\n';
            }
            return fullText;
        }

        async function parseDocx(file) {
            var arrayBuffer = await file.arrayBuffer();
            var result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
            return result.value;
        }

        function extractCandidateName(text) {
            var lines = text.split('\n').filter(function(l) { return l.trim(); });
            var chineseNamePattern = /^[\u4e00-\u9fa5]{2,4}/;
            var englishNamePattern = /^([A-Z][a-z]+(?:\s+[A-Z][a-z]+)+)/;
            for (var i = 0; i < Math.min(10, lines.length); i++) {
                var line = lines[i].trim();
                var cnMatch = line.match(chineseNamePattern);
                if (cnMatch && cnMatch[0].length >= 2 && cnMatch[0].length <= 4) return cnMatch[0];
                var enMatch = line.match(englishNamePattern);
                if (enMatch) return enMatch[1];
            }
            return lines[0] ? lines[0].substring(0, 20) : '未知候选人';
        }

        async function screenResume(file) {
            var text = file.content;
            var smartMode = document.getElementById('smartModeToggle').checked;
            var selectedJobIds = Array.from(selectedJobs);
            var scores = {};
            var bestMatch = null;
            var bestScore = 0;

            selectedJobIds.forEach(function(jobId) {
                var job = JOBS.find(function(j) { return j.id === jobId; });
                if (job) {
                    var jobScore = calculateJobScore(text, job);
                    scores[jobId] = jobScore;
                    if (smartMode || jobScore.total > bestScore) {
                        bestScore = jobScore.total;
                        bestMatch = job;
                    }
                }
            });

            if (!smartMode && bestMatch) {
                bestMatch = JOBS.find(function(j) { return j.id === selectedJobIds[0]; });
            } else if (!bestMatch) {
                bestMatch = JOBS.find(function(j) { return j.id === selectedJobIds[0]; });
            }

            var evaluation = generateEvaluation(scores, bestMatch, text);
            var level = getRecommendationLevel(scores[bestMatch ? bestMatch.id : null] ? scores[bestMatch.id].total : 0);

            var scoresByDimension = {};
            SCORING_DIMENSIONS.forEach(function(dim) {
                var values = Object.values(scores).map(function(s) { return s[dim.key]; });
                scoresByDimension[dim.key] = values.reduce(function(a, b) { return a + b; }, 0) / values.length;
            });

            return {
                fileId: file.id,
                fileName: file.name,
                candidateName: file.candidateName,
                scores: scores,
                scoresByDimension: scoresByDimension,
                bestMatchScore: scores[bestMatch ? bestMatch.id : null] ? scores[bestMatch.id].total : 0,
                bestMatch: bestMatch,
                evaluation: evaluation,
                level: level,
                allJobs: selectedJobIds.map(function(id) {
                    var job = JOBS.find(function(j) { return j.id === id; });
                    return { job: job, score: scores[id] ? scores[id].total : 0 };
                }).sort(function(a, b) { return b.score - a.score; })
            };
        }

        function calculateJobScore(text, job) {
            var weights = { tech: 0.20, project: 0.20, experience: 0.15, english: 0.10, opensource: 0.10, industry: 0.15, production: 0.10 };
            var scores = {};
            var textLower = text.toLowerCase();

            var techScore = 0;
            job.keywords.high.forEach(function(kw) { if (textLower.indexOf(kw.toLowerCase()) !== -1) techScore += 10; });
            job.keywords.medium.forEach(function(kw) { if (textLower.indexOf(kw.toLowerCase()) !== -1) techScore += 5; });
            scores.tech = Math.min(10, techScore / (job.keywords.high.length * 1.5 + job.keywords.medium.length * 2) * 10);

            var projectScore = 0;
            var projectKeywords = ['项目', 'project', '开发', '实现', '设计', '主导', '负责', '参与', '架构', '系统'];
            projectKeywords.forEach(function(kw) { if (text.indexOf(kw) !== -1) projectScore += 2; });
            var llmKeywords = ['llm', '大模型', 'agent', 'rag', 'transformer', 'fine-tuning', 'chatgpt', 'gpt-4', 'llama', 'bert', 'gpt'];
            llmKeywords.forEach(function(kw) { if (textLower.indexOf(kw) !== -1) projectScore += 3; });
            if (job.description) {
                var descWords = job.description.toLowerCase().split(/\s+/).filter(function(w) { return w.length > 3; });
                var descMatch = 0;
                descWords.forEach(function(word) { if (textLower.indexOf(word) !== -1) descMatch += 1; });
                projectScore += (descMatch / Math.max(descWords.length, 1)) * 3;
            }
            scores.project = Math.min(10, projectScore);

            var expScore = 5;
            var yearPatterns = [
                { pattern: /(\d+)[\-到至](\d+)年/, extract: function(m) { return (parseInt(m[1]) + parseInt(m[2])) / 2; } },
                { pattern: /(\d+)年.*经验/, extract: function(m) { return parseInt(m[1]); } },
                { pattern: /experience.*(\d+).*year/i, extract: function(m) { return parseInt(m[1]); } }
            ];
            var extractedYears = 0;
            yearPatterns.forEach(function(p) {
                var match = text.match(p.pattern);
                if (match) extractedYears = Math.max(extractedYears, p.extract(match));
            });
            if (extractedYears > 0) {
                var requiredYears = parseInt(job.experience) || 2;
                expScore = Math.min(10, 5 + (extractedYears / requiredYears) * 3);
            }
            scores.experience = Math.min(10, expScore);

            var englishScore = 5;
            var englishIndicators = ['english', 'cet-4', 'cet-6', 'toefl', 'ielts', '海外', 'abroad', 'foreign'];
            var englishCount = 0;
            englishIndicators.forEach(function(kw) { if (textLower.indexOf(kw) !== -1) englishCount++; });
            var englishRatio = (text.match(/[a-z]/gi) || []).length / Math.max(text.length, 1);
            if (englishRatio > 0.5) englishScore = 8;
            else if (englishCount > 0) englishScore = 6 + Math.min(englishCount, 2);
            scores.english = Math.min(10, englishScore);

            var osScore = 0;
            var osKeywords = ['github', 'gitlab', '开源', 'open source', '论文', 'paper', 'publication', 'arxiv', 'conference', 'cvpr', 'nips', 'icml', 'acl'];
            osKeywords.forEach(function(kw) { if (textLower.indexOf(kw) !== -1) osScore += 2; });
            scores.opensource = Math.min(10, osScore);

            var industryScore = 5;
            var industryKeywords = ['保险', 'insurtech', '金融', 'fintech', 'finance', 'bank', '银行', '保险科技'];
            var industryCount = 0;
            industryKeywords.forEach(function(kw) { if (text.indexOf(kw) !== -1) industryCount++; });
            industryScore = 5 + industryCount * 1.5;
            scores.industry = Math.min(10, industryScore);

            var prodScore = 5;
            var prodKeywords = ['生产环境', 'production', '上线', '部署', 'kubernetes', 'docker', 'aws', '阿里云', 'azure', 'gcp', '灰度', '发布'];
            var prodCount = 0;
            prodKeywords.forEach(function(kw) { if (textLower.indexOf(kw) !== -1) prodCount++; });
            prodScore = 5 + Math.min(prodCount * 1.5, 5);
            scores.production = Math.min(10, prodScore);

            var total = 0;
            for (var key in scores) {
                if (scores.hasOwnProperty(key)) {
                    total += scores[key] * (weights[key] || 0);
                }
            }
            scores.total = Math.round(total * 10) / 10;
            return scores;
        }

        function getRecommendationLevel(score) {
            if (score >= 7.5) return { level: 'strong', label: '强烈推荐', badge: 'badge-strong' };
            if (score >= 6) return { level: 'recommend', label: '推荐', badge: 'badge-recommend' };
            if (score >= 4.5) return { level: 'pending', label: '待定', badge: 'badge-pending' };
            return { level: 'reject', label: '不推荐', badge: 'badge-reject' };
        }

        function generateEvaluation(scores, bestMatch, text) {
            var avgScores = {};
            SCORING_DIMENSIONS.forEach(function(dim) {
                var values = Object.values(scores).map(function(s) { return s[dim.key]; });
                avgScores[dim.key] = values.reduce(function(a, b) { return a + b; }, 0) / values.length;
            });

            var strengths = [];
            if (avgScores.tech >= 7) strengths.push('技术栈与岗位需求高度匹配');
            if (avgScores.project >= 7) strengths.push('项目经验丰富，尤其在AI/ML领域');
            if (avgScores.english >= 7) strengths.push('具备优秀的英文能力');
            if (avgScores.opensource >= 7) strengths.push('有开源项目或学术研究贡献');
            if (avgScores.production >= 7) strengths.push('有丰富的生产环境部署经验');
            if (avgScores.industry >= 7) strengths.push('有保险/金融科技相关行业经验');
            if (strengths.length === 0) strengths.push('基础技能扎实，有一定的项目经验');

            var risks = [];
            if (avgScores.tech < 5) risks.push('技术栈匹配度偏低，需要进一步评估');
            if (avgScores.project < 5) risks.push('项目经验相对薄弱');
            if (avgScores.english < 5) risks.push('英文能力可能需要加强');
            if (avgScores.experience < 5) risks.push('工作年限相对较短，经验积累有限');
            if (avgScores.production < 5) risks.push('缺乏生产环境实战经验');
            if (risks.length === 0) risks.push('未发现明显风险点');

            var interviewFocus = generateInterviewFocus(avgScores, bestMatch, text);

            return {
                level: getRecommendationLevel(scores[bestMatch ? bestMatch.id : null] ? scores[bestMatch.id].total : 0),
                strengths: strengths.slice(0, 3),
                risks: risks,
                bestMatchJob: bestMatch ? bestMatch.title : '未知',
                interviewFocus: interviewFocus
            };
        }

        function generateInterviewFocus(scores, bestMatch, text) {
            var focusPoints = [];
            var textLower = text.toLowerCase();
            var keyTechs = ['PyTorch', 'TensorFlow', 'LangChain', 'LLM', 'RAG', 'Agent', 'GPT', 'transformer', 'fine-tuning'];
            var techMentions = [];
            keyTechs.forEach(function(tech) {
                if (textLower.indexOf(tech.toLowerCase()) !== -1) techMentions.push(tech);
            });
            if (techMentions.length > 0) {
                focusPoints.push('深入了解 ' + techMentions.slice(0, 3).join('、') + ' 的实际应用经验');
            }
            if (scores.project < 6) focusPoints.push('请详细描述1-2个最具挑战性的AI/ML项目');
            if (scores.production < 6) focusPoints.push('探讨生产环境部署的具体方案和遇到的问题');
            if (scores.opensource >= 6) focusPoints.push('了解开源项目的贡献细节和技术难点');
            if (focusPoints.length === 0) {
                focusPoints.push('全面了解项目经验和技术能力');
                focusPoints.push('评估学习能力和成长潜力');
            }
            return focusPoints.slice(0, 4);
        }

        function renderResults() {
            var resultsSection = document.getElementById('resultsSection');
            resultsSection.classList.add('active');
            renderStats();
            renderCandidates();
            resultsSection.scrollIntoView({ behavior: 'smooth' });
        }

        function renderStats() {
            var total = screeningResults.length;
            var strong = screeningResults.filter(function(r) { return r.level.level === 'strong'; }).length;
            var recommend = screeningResults.filter(function(r) { return r.level.level === 'recommend'; }).length;
            var pending = screeningResults.filter(function(r) { return r.level.level === 'pending'; }).length;
            var reject = screeningResults.filter(function(r) { return r.level.level === 'reject'; }).length;

            document.getElementById('statsGrid').innerHTML = 
                '<div class="stat-card total">' +
                    '<div class="stat-icon">📋</div>' +
                    '<div class="stat-number">' + total + '</div>' +
                    '<div class="stat-label">总简历数</div>' +
                '</div>' +
                '<div class="stat-card recommend">' +
                    '<div class="stat-icon">⭐</div>' +
                    '<div class="stat-number">' + (strong + recommend) + '</div>' +
                    '<div class="stat-label">推荐及以上</div>' +
                '</div>' +
                '<div class="stat-card pending">' +
                    '<div class="stat-icon">⏳</div>' +
                    '<div class="stat-number">' + pending + '</div>' +
                    '<div class="stat-label">待定</div>' +
                '</div>' +
                '<div class="stat-card reject">' +
                    '<div class="stat-icon">❌</div>' +
                    '<div class="stat-number">' + reject + '</div>' +
                    '<div class="stat-label">不推荐</div>' +
                '</div>';
        }

        function renderCandidates() {
            var container = document.getElementById('candidatesContainer');
            container.innerHTML = screeningResults.map(function(candidate) {
                var strengths = candidate.evaluation.strengths.join('；');
                var risks = candidate.evaluation.risks[0];
                var interviewPoints = candidate.evaluation.interviewFocus.map(function(p, i) {
                    return (i + 1) + '. ' + p;
                }).join('<br>');
                var allJobs = candidate.allJobs.map(function(item) {
                    return '<div class="score-item">' +
                        '<span class="score-label">' + (item.job ? item.job.title : '未知') + '</span>' +
                        '<div class="score-bar-container">' +
                            '<div class="score-bar" style="width: ' + (item.score * 10) + '%"></div>' +
                        '</div>' +
                        '<span class="score-value">' + item.score.toFixed(1) + '</span>' +
                    '</div>';
                }).join('');
                var matchedJobs = candidate.allJobs.sort(function(a, b) { return b.score - a.score; }).slice(0, 4).map(function(item) {
                    return '<span class="matched-job">' +
                        (item.job ? item.job.title : '未知') +
                        '<span class="job-score">' + item.score.toFixed(1) + '</span>' +
                    '</span>';
                }).join('');

                return '<div class="candidate-card level-' + candidate.level.level + '" data-candidate-id="' + candidate.fileId + '" onclick="toggleCandidateDetails(this)">' +
                    '<div class="candidate-header">' +
                        '<div class="candidate-name-section">' +
                            '<div class="candidate-avatar">' + getInitials(candidate.candidateName) + '</div>' +
                            '<div class="candidate-basic">' +
                                '<div class="candidate-name">' + candidate.candidateName + '</div>' +
                                '<div class="candidate-file">' + candidate.fileName + '</div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="candidate-score-section">' +
                            '<div class="candidate-score">' + candidate.bestMatchScore.toFixed(1) + '</div>' +
                            '<span class="candidate-badge ' + candidate.level.badge + '">' + candidate.level.label + '</span>' +
                            '<span class="best-match">' + candidate.evaluation.bestMatchJob + '</span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="candidate-summary">' +
                        '<div class="summary-item">' +
                            '<span class="summary-label">核心优势：</span>' +
                            '<span class="summary-text">' + strengths + '</span>' +
                        '</div>' +
                        '<div class="summary-item">' +
                            '<span class="summary-label">潜在风险：</span>' +
                            '<span class="summary-text">' + risks + '</span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="candidate-details">' +
                        '<div class="details-grid">' +
                            '<div class="detail-section">' +
                                '<div class="detail-title">能力雷达图</div>' +
                                '<div class="radar-chart">' + renderRadarChart(candidate.scoresByDimension) + '</div>' +
                            '</div>' +
                            '<div class="detail-section">' +
                                '<div class="detail-title">各岗位得分</div>' +
                                '<div class="scores-list">' + allJobs + '</div>' +
                                '<div class="detail-title" style="margin-top: 20px;">匹配岗位</div>' +
                                '<div class="matched-jobs">' + matchedJobs + '</div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="evaluation-section">' +
                            '<div class="evaluation-item">' +
                                '<div class="evaluation-label">总体评价</div>' +
                                '<div class="evaluation-text">' +
                                    '该候选人在<b>' + candidate.evaluation.bestMatchJob + '</b>岗位上表现出较好的匹配度。' +
                                    candidate.evaluation.strengths.join('。') + '。' +
                                    (candidate.evaluation.risks[0] !== '未发现明显风险点' ? candidate.evaluation.risks.join('。') : '') +
                                '</div>' +
                            '</div>' +
                            '<div class="evaluation-item">' +
                                '<div class="evaluation-label">建议面试重点关注</div>' +
                                '<div class="interview-tips">' +
                                    '<div class="evaluation-text">' + interviewPoints + '</div>' +
                                '</div>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function renderRadarChart(scores) {
            var labels = SCORING_DIMENSIONS.map(function(d) { return d.name; });
            var values = SCORING_DIMENSIONS.map(function(d) { return scores[d.key] || 0; });
            var centerX = 140, centerY = 140, radius = 90;
            var points = labels.map(function(_, i) {
                var angle = (Math.PI * 2 * i / labels.length) - Math.PI / 2;
                return {
                    x: Math.cos(angle) * radius * (values[i] / 10) + centerX,
                    y: Math.sin(angle) * radius * (values[i] / 10) + centerY
                };
            });
            var polygonPoints = points.map(function(p) { return p.x + ',' + p.y; }).join(' ');

            var lines = labels.map(function(_, i) {
                var angle = (Math.PI * 2 * i / labels.length) - Math.PI / 2;
                var x = Math.cos(angle) * radius + centerX;
                var y = Math.sin(angle) * radius + centerY;
                return '<line x1="' + centerX + '" y1="' + centerY + '" x2="' + x + '" y2="' + y + '" stroke="rgba(153,172,255,0.2)" stroke-width="1"/>';
            }).join('');

            var circles = points.map(function(p) {
                return '<circle cx="' + p.x + '" cy="' + p.y + '" r="5" fill="#00D9FF" stroke="white" stroke-width="2"/>';
            }).join('');

            var labelSpans = labels.map(function(label, i) {
                var angle = (Math.PI * 2 * i / labels.length) - Math.PI / 2;
                var labelRadius = radius + 30;
                var labelX = Math.cos(angle) * labelRadius + centerX;
                var labelY = Math.sin(angle) * labelRadius + centerY;
                if (i === 0) labelY -= 8;
                if (i === 1) labelY -= 5;
                if (i === 5) labelY += 8;
                if (i === 6) labelY += 5;
                return '<span class="radar-label" style="left: ' + labelX + 'px; top: ' + labelY + 'px;">' + label + '<br><small style="color: #00D9FF;">' + values[i].toFixed(1) + '</small></span>';
            }).join('');

            return '<div class="radar-grid">' +
                '<div class="radar-circle radar-ring-1"></div>' +
                '<div class="radar-circle radar-ring-2"></div>' +
                '<div class="radar-circle radar-ring-3"></div>' +
                '<div class="radar-circle radar-ring-4"></div>' +
            '</div>' +
            '<svg width="280" height="280" style="position: absolute; top: 0; left: 0;">' +
                lines +
                '<polygon points="' + polygonPoints + '" fill="rgba(24,29,216,0.3)" stroke="#99ACFF" stroke-width="2"/>' +
                circles +
            '</svg>' +
            '<div class="radar-labels">' + labelSpans + '</div>';
        }

        function toggleCandidateDetails(card) {
            card.classList.toggle('expanded');
        }

        function sortCandidates() {
            var sortBy = document.getElementById('sortSelect').value;
            switch (sortBy) {
                case 'score-desc': screeningResults.sort(function(a, b) { return b.bestMatchScore - a.bestMatchScore; }); break;
                case 'score-asc': screeningResults.sort(function(a, b) { return a.bestMatchScore - b.bestMatchScore; }); break;
                case 'name-asc': screeningResults.sort(function(a, b) { return a.candidateName.localeCompare(b.candidateName, 'zh-CN'); }); break;
                case 'name-desc': screeningResults.sort(function(a, b) { return b.candidateName.localeCompare(a.candidateName, 'zh-CN'); }); break;
            }
            renderCandidates();
        }

        function getInitials(name) {
            if (!name) return '??';
            var chinese = name.match(/[\u4e00-\u9fa5]/g);
            if (chinese && chinese.length >= 2) return chinese.slice(0, 2).join('');
            var parts = name.split(/\s+/);
            if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
            return name.substring(0, 2).toUpperCase();
        }

        function showLoading(show) {
            var overlay = document.getElementById('loadingOverlay');
            if (show) {
                overlay.classList.add('active');
            } else {
                overlay.classList.remove('active');
            }
        }

        function exportCSV() {
            var headers = ['候选人姓名', '文件名', '综合得分', '推荐等级', '最佳匹配岗位', '核心优势', '潜在风险', '面试关注点'];
            var dimHeaders = SCORING_DIMENSIONS.map(function(d) { return d.name + '(1-10)'; });
            var allHeaders = headers.concat(dimHeaders);

            var fullRows = screeningResults.map(function(c) {
                var dims = SCORING_DIMENSIONS.map(function(d) { return c.scoresByDimension[d.key].toFixed(1); });
                return [
                    c.candidateName,
                    c.fileName,
                    c.bestMatchScore.toFixed(1),
                    c.level.label,
                    c.evaluation.bestMatchJob,
                    c.evaluation.strengths.join('；'),
                    c.evaluation.risks.join('；'),
                    c.evaluation.interviewFocus.join('；')
                ].concat(dims);
            });

            var csvContent = '\ufeff';
            csvContent += allHeaders.map(function(h) { return '"' + h + '"'; }).join(',') + '\n';
            fullRows.forEach(function(row) {
                csvContent += row.map(function(cell) { return '"' + String(cell).replace(/"/g, '""') + '"'; }).join(',') + '\n';
            });

            var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            var link = document.createElement('a');
            var url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', 'BJAK_简历筛选结果_' + new Date().toISOString().slice(0, 10) + '.csv');
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderJobGrid();
            setupUploadArea();
            updateStartButton();
        });
    </script>
</body>
</html>
